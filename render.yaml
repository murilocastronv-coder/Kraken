services:
  - type: web
    name: kraken-paper-trader
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: paper-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAPER_ONLY
        value: "true"
      - key: STATE_FILE
        value: /var/data/state.json
      - key: INITIAL_CASH
        value: "10000"
      - key: SYMBOL
        value: BTC/USD
